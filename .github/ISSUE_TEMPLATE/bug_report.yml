name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "`quicx version`, or the version of the client or page"
      placeholder: quicx v2.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and CPU
      placeholder: Raspberry Pi OS 64-bit, arm64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead, with the exact output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or a short program that shows the problem.
    validations:
      required: true
